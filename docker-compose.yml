services:
  app:
    build: .
    container_name: mis-alumni-portal
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=mis_alumni_pass
      - DB_NAME=mis_alumni
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build: .
    container_name: mis-alumni-migrate
    command: node src/db/migrate.js
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=mis_alumni_pass
      - DB_NAME=mis_alumni
    depends_on:
      mysql:
        condition: service_healthy

  seed:
    build: .
    profiles: ["tools"]
    container_name: mis-alumni-seed
    command: node src/db/seed.js
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=mis_alumni_pass
      - DB_NAME=mis_alumni
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8
    container_name: mis-alumni-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mis_alumni_pass
      MYSQL_DATABASE: mis_alumni
    ports:
      - "3306:3306"
    volumes:
      - mis-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mis-mysql-data:
